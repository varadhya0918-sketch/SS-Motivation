<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>∞ SS Motivation</title>

<style>

/* ===============================
   INFINITE MOTIVATION — VERSION 2
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}


/* ===============================
   CINEMATIC BACKGROUND
================================ */

#background {
    position: absolute;
    inset: 0;

    background-size: cover;
    background-position: center;

    transition: opacity 1.2s ease;

    animation: cinematicZoom 18s ease-in-out infinite alternate;

    transform: scale(1.08);
}

@keyframes cinematicZoom {

    from {
        transform: scale(1.05);
    }

    to {
        transform: scale(1.18);
    }

}


/* DARK CINEMATIC OVERLAY */

#overlay {

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.85)
        ),

        linear-gradient(
            135deg,
            rgba(0,0,0,0.55),
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.70)
        );
}


/* ===============================
   TOP HEADER
================================ */

#header {

    position: absolute;

    top: 22px;

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 22px;

    z-index: 10;

}


.brand {

    display: flex;

    align-items: center;

    gap: 10px;

}


.infinity {

    font-size: 35px;

    font-weight: bold;

}


.brand-name {

    font-size: 11px;

    letter-spacing: 3px;

    opacity: 0.75;

}


.live {

    font-size: 10px;

    letter-spacing: 2px;

    opacity: 0.8;

    display: flex;

    align-items: center;

    gap: 7px;

}


.dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #fff;

    animation: pulse 1.5s infinite;

}


@keyframes pulse {

    0%, 100% {
        opacity: 0.3;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

}


/* ===============================
   QUOTE AREA
================================ */

#quoteContainer {

    width: min(1000px, 90%);

    text-align: center;

    z-index: 5;

    transition: opacity 0.6s ease,
                transform 0.6s ease;

}


#quoteMark {

    font-size: 80px;

    height: 55px;

    opacity: 0.45;

}


#quote {

    font-size: clamp(28px, 5vw, 70px);

    font-weight: 700;

    line-height: 1.22;

    text-shadow:
        0 4px 30px rgba(0,0,0,0.9);

}


#author {

    margin-top: 30px;

    font-size: clamp(13px, 2vw, 19px);

    letter-spacing: 2px;

    opacity: 0.75;

}


/* QUOTE ANIMATION */

.hideQuote {

    opacity: 0;

    transform: translateY(20px);

}


/* ===============================
   BOTTOM AREA
================================ */

#bottom {

    position: absolute;

    bottom: 25px;

    width: 100%;

    text-align: center;

    z-index: 10;

}


#counter {

    font-size: 11px;

    letter-spacing: 2px;

    opacity: 0.7;

}


#status {

    margin-top: 9px;

    font-size: 10px;

    letter-spacing: 2px;

    opacity: 0.45;

}


/* ===============================
   PROGRESS BAR
================================ */

#progressBackground {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    height: 3px;

    background: rgba(255,255,255,0.15);

    z-index: 20;

}


#progress {

    height: 100%;

    width: 0%;

    background: white;

}


/* ===============================
   SHARE BUTTON
================================ */

#shareButton {

    position: absolute;

    right: 18px;

    bottom: 70px;

    width: 44px;

    height: 44px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.3);

    background: rgba(0,0,0,0.25);

    color: white;

    font-size: 18px;

    cursor: pointer;

    z-index: 20;

    backdrop-filter: blur(8px);

}


/* ===============================
   PAUSE INDICATOR
================================ */

#paused {

    position: absolute;

    top: 70px;

    left: 50%;

    transform: translateX(-50%);

    font-size: 10px;

    letter-spacing: 3px;

    opacity: 0;

    transition: opacity 0.3s;

    z-index: 20;

}


#paused.show {

    opacity: 0.7;

}


/* MOBILE */

@media (max-width: 600px) {

    #header {
        padding: 0 16px;
    }

    .brand-name {
        font-size: 9px;
    }

    .live {
        font-size: 8px;
    }

    #quote {
        font-size: clamp(27px, 8vw, 48px);
    }

    #quoteContainer {
        width: 88%;
    }

}

</style>

</head>

<body>

<div id="app">

```
<div id="background"></div>

<div id="overlay"></div>


<!-- HEADER -->

<div id="header">

    <div class="brand">

        <div class="infinity">∞</div>

        <div class="brand-name">
            INFINITE MOTIVATION
        </div>

    </div>


    <div class="live">

        <div class="dot"></div>

        LIVE

    </div>

</div>


<!-- PAUSED -->

<div id="paused">

    PAUSED

</div>


<!-- QUOTE -->

<div id="quoteContainer">

    <div id="quoteMark">

        “

    </div>


    <div id="quote">

        Loading inspiration...

    </div>


    <div id="author"></div>

</div>


<!-- SHARE -->

<button id="shareButton">

    ↗

</button>


<!-- BOTTOM -->

<div id="bottom">

    <div id="counter">

        SESSION MOTIVATION #1

    </div>

    <div id="status">

        CONNECTING TO INSPIRATION...

    </div>

</div>


<!-- PROGRESS -->

<div id="progressBackground">

    <div id="progress"></div>

</div>
```

</div>

<script>


/* =====================================
   SETTINGS
===================================== */

const QUOTE_DURATION = 7000;


/* =====================================
   BACKGROUND COLLECTION
===================================== */

const backgrounds = [

"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=85",

"https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=1920&q=85"

];


/* =====================================
   OFFLINE FALLBACK QUOTES

   Website still works if API is down
===================================== */

const fallbackQuotes = [

{
quote: "The future depends on what you do today.",
author: "Mahatma Gandhi"
},

{
quote: "It always seems impossible until it's done.",
author: "Nelson Mandela"
},

{
quote: "Believe you can and you're halfway there.",
author: "Theodore Roosevelt"
},

{
quote: "The secret of getting ahead is getting started.",
author: "Mark Twain"
},

{
quote: "Success is not final. Failure is not fatal. It is the courage to continue that counts.",
author: "Winston Churchill"
},

{
quote: "The best way to predict the future is to create it.",
author: "Peter Drucker"
}

];


/* =====================================
   DOM ELEMENTS
===================================== */

const quoteElement =
document.getElementById("quote");

const authorElement =
document.getElementById("author");

const quoteContainer =
document.getElementById("quoteContainer");

const backgroundElement =
document.getElementById("background");

const counterElement =
document.getElementById("counter");

const progressElement =
document.getElementById("progress");

const statusElement =
document.getElementById("status");

const pausedElement =
document.getElementById("paused");


/* =====================================
   QUOTE DATABASE
===================================== */

let quotePool = [];

let sessionNumber = 0;

let lastQuote = "";

let isPaused = false;

let timer = null;


/* =====================================
   FETCH REAL QUOTES

   QuoteSlate API
   2600+ inspirational quotes
===================================== */

async function loadQuotes() {

    statusElement.textContent =
    "FETCHING REAL INSPIRATION...";


    try {

        const response = await fetch(

"https://quoteslate.vercel.app/api/quotes/random?count=50"

        );


        if (!response.ok) {

            throw new Error("API unavailable");

        }


        const data = await response.json();


        /*
        Convert API format safely
        */

        quotePool = data.map(item => ({

            quote:
            item.quote ||
            item.text ||
            item.content,

            author:
            item.author ||
            "Unknown"

        }))
        .filter(item => item.quote);


        if (quotePool.length === 0) {

            throw new Error("No quotes received");

        }


        statusElement.textContent =
        "LIVE QUOTES • 2,600+ POSSIBILITIES";


    }

    catch (error) {


        console.log(
        "Online API unavailable. Using fallback.",
        error
        );


        quotePool = fallbackQuotes;


        statusElement.textContent =
        "INSPIRATION MODE";


    }

}


/* =====================================
   GET NEXT QUOTE
===================================== */

function getNextQuote() {

    if (quotePool.length === 0) {

        return fallbackQuotes[
            Math.floor(
                Math.random() *
                fallbackQuotes.length
            )
        ];

    }


    let selected;


    let attempts = 0;


    do {

        selected =
        quotePool[
            Math.floor(
                Math.random() *
                quotePool.length
            )
        ];

        attempts++;

    }

    while (

        selected.quote === lastQuote

        &&

        attempts < 10

    );


    lastQuote = selected.quote;


    return selected;

}


/* =====================================
   BACKGROUND
===================================== */

function changeBackground() {

    const image =

    backgrounds[
        Math.floor(
            Math.random() *
            backgrounds.length
        )
    ];


    backgroundElement.style.opacity = 0;


    setTimeout(() => {

        backgroundElement.style.backgroundImage =
        `url("${image}")`;

        backgroundElement.style.opacity = 1;

    }, 500);

}


/* =====================================
   SHOW QUOTE
===================================== */

function showNextQuote() {


    if (isPaused) return;


    quoteContainer.classList.add(
        "hideQuote"
    );


    setTimeout(() => {


        const selected =
        getNextQuote();


        quoteElement.textContent =
        selected.quote;


        authorElement.textContent =
        "— " + selected.author;


        sessionNumber++;


        counterElement.textContent =

        "SESSION MOTIVATION #" +

        sessionNumber.toLocaleString();


        changeBackground();


        quoteContainer.classList.remove(
            "hideQuote"
        );


    }, 550);


    startProgress();

}


/* =====================================
   PROGRESS BAR
===================================== */

function startProgress() {


    progressElement.style.transition =
    "none";


    progressElement.style.width =
    "0%";


    setTimeout(() => {


        progressElement.style.transition =

        `width ${QUOTE_DURATION}ms linear`;


        progressElement.style.width =
        "100%";


    }, 50);

}


/* =====================================
   AUTO PLAY
===================================== */

function startAutoPlay() {


    clearInterval(timer);


    timer = setInterval(() => {


        if (!isPaused) {

            showNextQuote();

        }


    }, QUOTE_DURATION);

}


/* =====================================
   CLICK = NEXT QUOTE
===================================== */

document.addEventListener(
"click",

(event) => {


    if (

        event.target.id ===
        "shareButton"

    ) return;


    if (!isPaused) {

        showNextQuote();

    }

}

);


/* =====================================
   HOLD = PAUSE
===================================== */

let holdTimer;


document.addEventListener(
"pointerdown",

() => {


    holdTimer = setTimeout(() => {


        isPaused = true;


        pausedElement.classList.add(
            "show"
        );


        progressElement.style.transition =
        "none";


    }, 700);

}


);


document.addEventListener(
"pointerup",

() => {


    clearTimeout(holdTimer);


    if (isPaused) {


        isPaused = false;


        pausedElement.classList.remove(
            "show"
        );


        startProgress();


    }

}

);


/* =====================================
   SHARE BUTTON
===================================== */

document
.getElementById("shareButton")
.addEventListener(

"click",

async (event) => {


    event.stopPropagation();


    const shareData = {

        title:
        "∞ Infinite Motivation",

        text:
        "An endless stream of motivation.",

        url:
        window.location.href

    };


    try {


        if (navigator.share) {


            await navigator.share(
                shareData
            );


        }

        else {


            await navigator.clipboard.writeText(

                window.location.href

            );


            statusElement.textContent =

            "LINK COPIED ✓";


        }


    }

    catch (error) {

        console.log(
            "Share cancelled"
        );

    }

}

);


/* =====================================
   INITIALIZE WEBSITE
===================================== */

async function initialize() {


    changeBackground();


    await loadQuotes();


    showNextQuote();


    startAutoPlay();

}


initialize();


</script>

</body>

</html>
