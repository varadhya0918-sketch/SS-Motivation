<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>SS Motivation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    min-height: 100vh;
    overflow: hidden;
    background: #111;
}

.background {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 1.2s ease;
    z-index: -3;
}

.overlay {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.45),
            rgba(0,0,0,.25),
            rgba(0,0,0,.65)
        );
    z-index: -2;
}

.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.quote-box {
    width: min(900px, 95vw);
    text-align: center;
    padding: 55px 35px;
    background: rgba(0,0,0,.32);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 25px;
    box-shadow: 0 20px 70px rgba(0,0,0,.4);
}

.logo {
    font-size: 15px;
    letter-spacing: 5px;
    opacity: .8;
    margin-bottom: 35px;
}

.quote {
    font-size: clamp(28px, 5vw, 55px);
    line-height: 1.25;
    font-weight: 700;
    text-shadow: 0 4px 25px rgba(0,0,0,.8);
    transition: opacity .5s ease, transform .5s ease;
}

.author {
    margin-top: 28px;
    font-size: 15px;
    opacity: .7;
}

.status {
    position: fixed;
    top: 20px;
    right: 22px;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: .8;
}

.progress {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 4px;
    width: 0%;
    background: white;
}

.hint {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    opacity: .55;
}

button {
    position: fixed;
    bottom: 55px;
    right: 25px;
    padding: 11px 18px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.35);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(8px);
}

button:hover {
    background: rgba(255,255,255,.2);
}
</style>
</head>

<body>

<div class="background" id="background"></div>
<div class="overlay"></div>

<div class="status" id="status">● LIVE</div>

<div class="container">
    <div class="quote-box">

<button onclick="nextQuote()">NEXT →</button>

<div class="hint">
    Click anywhere for another quote • Spacebar also works

<div class="progress" id="progress"></div>

/* =========================================================
   ENGINE
   ========================================================= */

let unusedQuotes = [...quotes];
let currentQuote = "";
let sessionNumber = 0;

const CHANGE_TIME = 7000;

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function getQuote() {

    if (unusedQuotes.length === 0) {
        unusedQuotes = [...quotes];
    }

    let index = Math.floor(Math.random() * unusedQuotes.length);

    let selected = unusedQuotes.splice(index, 1)[0];

    return selected;
}

function showQuote() {

    const quoteElement = document.getElementById("quote");
    const authorElement = document.getElementById("author");
    const background = document.getElementById("background");

    quoteElement.style.opacity = "0";
    quoteElement.style.transform = "translateY(15px)";

    setTimeout(() => {

        currentQuote = getQuote();
        sessionNumber++;

        quoteElement.innerText = `"${currentQuote}"`;

        authorElement.innerText =
            "INFINITE MOTIVATION • #" + sessionNumber;

        background.style.backgroundImage =
            `url("${randomItem(backgrounds)}")`;

        quoteElement.style.opacity = "1";
        quoteElement.style.transform = "translateY(0)";

    }, 450);
}


/* =========================================================
   AUTOMATIC CHANGE
   ========================================================= */

let timer = null;
let startTime = Date.now();

function startTimer() {

    startTime = Date.now();

    clearInterval(timer);

    timer = setInterval(() => {

        showQuote();

    }, CHANGE_TIME);
}


/* =========================================================
   PROGRESS BAR
   ========================================================= */

function updateProgress() {

    const progress = document.getElementById("progress");

    const elapsed = Date.now() - startTime;

    let percent =
        (elapsed / CHANGE_TIME) * 100;

    if (percent > 100) percent = 100;

    progress.style.width = percent + "%";

    requestAnimationFrame(updateProgress);
}


/* =========================================================
   NEXT BUTTON / CLICK
   ========================================================= */

function nextQuote() {

    showQuote();

    startTimer();

}


/* Click anywhere */

document.addEventListener("click", function(event) {

    if (event.target.tagName !== "BUTTON") {

        nextQuote();

    }

});


/* Spacebar */

document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();

        nextQuote();

    }

});


/* =========================================================
   START
   ========================================================= */

showQuote();

startTimer();

updateProgress();

</script>
