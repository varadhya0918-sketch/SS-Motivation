<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>∞ Infinite Motivation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:#080808;
}

.bg{
    position:fixed;
    inset:0;
    z-index:-5;
    background-size:cover;
    background-position:center;
    transition:opacity 1s ease;
}

.bg2{
    position:fixed;
    inset:0;
    z-index:-4;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1s ease;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:-3;
    background:
        radial-gradient(circle at center,
        rgba(0,0,0,.05),
        rgba(0,0,0,.72)),
        linear-gradient(
        rgba(0,0,0,.25),
        rgba(0,0,0,.55)
        );
}

.top{
    position:fixed;
    top:22px;
    left:25px;
    right:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
}

.logo{
    font-size:13px;
    letter-spacing:4px;
    opacity:.8;
}

.live{
    font-size:11px;
    letter-spacing:2px;
    opacity:.75;
}

.live span{
    color:#5cff8d;
}

.main{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.card{
    width:min(950px,94vw);
    padding:55px 45px;
    text-align:center;

    background:rgba(0,0,0,.30);

    border:1px solid rgba(255,255,255,.18);
    border-radius:28px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);

    transition:
        opacity .5s ease,
        transform .5s ease;
}

.quote{
    font-size:clamp(27px,5vw,57px);
    line-height:1.25;
    font-weight:700;

    text-shadow:
        0 4px 25px rgba(0,0,0,.9);
}

.author{
    margin-top:28px;
    font-size:14px;
    letter-spacing:1px;
    opacity:.65;
}

.controls{
    position:fixed;
    bottom:28px;
    left:0;
    right:0;

    display:flex;
    justify-content:center;
    gap:12px;

    z-index:5;
}

button{
    padding:11px 20px;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(0,0,0,.35);
    color:white;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.2s;
}

button:hover{
    background:rgba(255,255,255,.18);
    transform:translateY(-2px);
}

.progress{
    position:fixed;
    bottom:0;
    left:0;

    height:3px;

    width:0%;

    background:white;

    z-index:10;
}

.counter{
    position:fixed;
    bottom:85px;
    left:0;
    right:0;

    text-align:center;

    font-size:11px;
    letter-spacing:2px;

    opacity:.45;
}

.loading{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#080808;

    z-index:100;

    transition:opacity .7s;
}

.loading.hide{
    opacity:0;
    pointer-events:none;
}

.loader{
    text-align:center;
}

.infinity{
    font-size:60px;
    margin-bottom:15px;
}

.loadingText{
    letter-spacing:4px;
    font-size:12px;
    opacity:.7;
}
</style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loader">
        <div class="infinity">∞</div>
        <div class="loadingText">LOADING MOTIVATION</div>
    </div>
</div>

<div class="bg" id="bg"></div>
<div class="bg2" id="bg2"></div>

<div class="overlay"></div>

<div class="top">

    <div class="logo">
        ∞ INFINITE MOTIVATION
    </div>

    <div class="live">
        <span>●</span> LIVE
    </div>

</div>

<div class="main">

    <div class="card" id="card">

        <div class="quote" id="quote">
            Loading inspiration...
        </div>

        <div class="author" id="author">
        </div>

    </div>

</div>

<div class="counter" id="counter">
    MOTIVATION #1
</div>

<div class="controls">

    <button onclick="nextQuote()">
        NEXT →
    </button>

    <button onclick="togglePause()" id="pauseButton">
        PAUSE
    </button>

</div>

<div class="progress" id="progress"></div>


<script>

"JEE ek din ki preparation se nahi, har din ki consistency se crack hota hai.",

"Every expert was once a beginner.",

"Progress demands patience.",

"Champions keep playing until they get it right.",

"Don't compare your beginning to someone else's middle.",

"Success starts with the decision to try.",

"Failure is not the opposite of success. It is part of success.",

"Greatness begins where comfort ends.",

"Your story is still being written.",

"Make progress your priority, not perfection."

];


/* =========================================================
   ONLINE QUOTE API
   ========================================================= */

const API =
"https://quoteslate.vercel.app/api/quotes/random?count=50&tags=motivation,wisdom";


/* =========================================================
   BACKGROUNDS
========================================================= */

const backgrounds = [

"https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=2000&q=85",

"https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85"

];


/* =========================================================
   STATE
========================================================= */

let onlineQuotes = [];
let used = new Set();

let current = "";
let number = 0;

let paused = false;
let timer = null;

let bgIndex = 0;


/* =========================================================
   RANDOM
========================================================= */

function random(array){

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


/* =========================================================
   ADD ONLINE QUOTES
========================================================= */

async function loadOnlineQuotes(){

    try{

        const response = await fetch(API);

        if(!response.ok){
            throw new Error("API unavailable");
        }

        const data = await response.json();

        if(Array.isArray(data)){

            data.forEach(item => {

                if(item.quote){

                    onlineQuotes.push({

                        text:item.quote,

                        author:item.author || ""

                    });

                }

            });

        }

        console.log(
            "Online quotes loaded:",
            onlineQuotes.length
        );

    }

    catch(error){

        console.log(
            "Online quotes unavailable. Using local collection."
        );

    }

}


/* =========================================================
   QUALITY FILTER
========================================================= */

function acceptable(text){

    if(!text) return false;

    if(text.length < 20) return false;

    if(text.length > 350) return false;

    const lower = text.toLowerCase();

    const unwanted = [

        "http",
        "www.",
        "subscribe",
        "instagram",
        "twitter.com",
        "facebook.com",
        "buy now",
        "click here"

    ];

    for(const word of unwanted){

        if(lower.includes(word))
            return false;

    }

    return true;

}


/* =========================================================
   GET NEXT QUOTE
========================================================= */

function getNextQuote(){

    let candidates = [];

    onlineQuotes.forEach(q => {

        if(
            acceptable(q.text) &&
            !used.has(q.text)
        ){

            candidates.push(q);

        }

    });


    if(candidates.length > 0){

        const selected = random(candidates);

        used.add(selected.text);

        return selected;

    }


    let localCandidates =
        localQuotes.filter(
            q => !used.has(q)
        );


    if(localCandidates.length === 0){

        used.clear();

        localCandidates =
            [...localQuotes];

    }


    const selected =
        random(localCandidates);

    used.add(selected);

    return {

        text:selected,

        author:""

    };

}


/* =========================================================
   CHANGE BACKGROUND
========================================================= */

function changeBackground(){

    bgIndex++;

    if(bgIndex >= backgrounds.length){

        bgIndex = 0;

    }

    const next =
        backgrounds[bgIndex];

    const bg =
        document.getElementById("bg");

    const bg2 =
        document.getElementById("bg2");


    bg2.style.backgroundImage =
        `url("${next}")`;

    bg2.style.opacity = "1";

    setTimeout(() => {

        bg.style.backgroundImage =
            `url("${next}")`;

        bg2.style.opacity = "0";

    },1000);

}


/* =========================================================
   SHOW QUOTE
========================================================= */

function showQuote(){

    const card =
        document.getElementById("card");

    const quote =
        document.getElementById("quote");

    const author =
        document.getElementById("author");

    const counter =
        document.getElementById("counter");


    card.style.opacity = "0";

    card.style.transform =
        "translateY(15px)";


    setTimeout(() => {

        const selected =
            getNextQuote();

        current =
            selected.text;

        number++;


        quote.textContent =
            `"${current}"`;


        if(selected.author){

            author.textContent =
                "— " + selected.author;

        }
        else{

            author.textContent =
                "INFINITE MOTIVATION";

        }


        counter.textContent =
            "MOTIVATION #" + number;


        changeBackground();


        card.style.opacity = "1";

        card.style.transform =
            "translateY(0)";


    },450);

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(timer);

    timer =
        setInterval(() => {

            if(!paused){

                showQuote();

            }

        },CHANGE_TIME);

}


/* =========================================================
   PROGRESS
========================================================= */

let progressStart =
    Date.now();


function progressLoop(){

    const progress =
        document.getElementById("progress");


    if(!paused){

        const elapsed =
            Date.now() - progressStart;

        let percent =
            (elapsed / CHANGE_TIME) * 100;


        if(percent > 100)
            percent = 100;


        progress.style.width =
            percent + "%";

    }


    requestAnimationFrame(
        progressLoop
    );

}


/* =========================================================
   NEXT
========================================================= */

function nextQuote(){

    progressStart =
        Date.now();

    showQuote();

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    paused = !paused;

    const button =
        document.getElementById(
            "pauseButton"
        );


    if(paused){

        button.textContent =
            "RESUME";

    }
    else{

        button.textContent =
            "PAUSE";

        progressStart =
            Date.now();

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.code === "Space"){

            event.preventDefault();

            nextQuote();

        }

        if(event.code === "KeyP"){

            togglePause();

        }

    }
);


/* =========================================================
   START
========================================================= */

async function start(){

    document
        .getElementById("bg")
        .style.backgroundImage =
        `url("${backgrounds[0]}")`;


    document
        .getElementById("bg2")
        .style.backgroundImage =
        `url("${backgrounds[1]}")`;


    showQuote();

    startTimer();

    progressLoop();


    await loadOnlineQuotes();


    setTimeout(() => {

        document
            .getElementById("loading")
            .classList
            .add("hide");

    },700);

}


start();

</script>

</body>
